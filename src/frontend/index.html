<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helmet Detector - YOLO11x Live Camera</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; text-align: center; }
    .container { max-width: 780px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    .badges { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; font-size: 14px; font-weight: 600; }
    .badge { padding: 6px 14px; border-radius: 999px; background: #0f172a; }
    .badge.safe { color: #4ade80; border: 1px solid #22c55e55; }
    .badge.violation { color: #f87171; border: 1px solid #ef444455; }
    .stage { position: relative; width: 100%; max-width: 640px; margin: 12px auto; background: #020617; border-radius: 12px; overflow: hidden; aspect-ratio: 4/3; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; margin-top: 14px; }
    button { padding: 10px 18px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; background: #4f46e5; color: white; font-size: 14px; }
    button.stop { background: #e11d48; }
    .status { font-size: 14px; color: #94a3b8; margin-top: 10px; }
    .stage.alarm { box-shadow: 0 0 0 4px #ef4444, 0 0 30px #ef4444aa; animation: flash 0.5s ease-in-out 3; }
    @keyframes flash { 50% { box-shadow: 0 0 0 4px transparent, 0 0 0 transparent; } }
    .sound-toggle { display: flex; align-items: center; gap: 6px; }
    video.mirror { transform: scaleX(-1); }
  </style>
</head>
<body>
  <div class="container">
    <h2>ระบบตรวจจับหมวกนิรภัยพร้อมติดตามรายบุคคล (ByteTrack)</h2>
    <div class="badges">
      <span class="badge safe">สวมหมวกถูกต้อง (Safe): <span id="safeCount">0</span></span>
      <span class="badge violation">ฝ่าฝืน/ไม่สวมหมวกเซฟตี้ (Alert): <span id="violationCount">0</span></span>
    </div>
    <div class="stage" id="stage">
      <video id="video" class="mirror" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
    </div>
    <div class="controls">
      <button onclick="startCamera()">เปิดกล้องเว็บแคม</button>
      <button class="stop" onclick="stopCamera()">หยุดกล้อง</button>
      <label class="sound-toggle"><input id="soundToggle" type="checkbox" checked> 🔊 เสียงเตือน</label>
      <label class="sound-toggle"><input id="mirrorToggle" type="checkbox" checked
        onchange="video.classList.toggle('mirror', this.checked)"> 🪞 กลับด้านแบบกระจก</label>
    </div>
    <p id="status" class="status">กดปุ่ม "เปิดกล้องเว็บแคม" เพื่อเริ่มต้นใช้งาน</p>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    let stream = null;
    let timer = null;
    let busy = false;

    // ---------- เสียงเตือนตอนเจอคนไม่สวมหมวก ----------
    // อยากใช้เพลง: วางไฟล์ไว้ที่ src/frontend/static/sounds/alert.mp3
    //   เพลงจะเล่นต่อเนื่องตอนเจอคนไม่สวมหมวก และหยุดเมื่อไม่เจอแล้ว 2 วินาที (เล่นต่อจากเดิม ไม่เริ่มใหม่ทุกครั้ง)
    // ถ้าไม่มีไฟล์ จะใช้เสียงไซเรนที่สร้างจากโค้ดแทน
    const SOUND_COOLDOWN_MS = 3000;   // ไซเรนดังได้อย่างมากทุก 3 วินาที ไม่ให้ดังรัวทุกเฟรม
    const SONG_STOP_AFTER_MS = 2000;  // ไม่เจอคนฝ่าฝืนนานเท่านี้ ค่อยหยุดเพลง
    const customSound = new Audio('/static/sounds/alert.mp3');
    customSound.loop = true;
    customSound.preload = 'auto';
    customSound.load();
    let hasCustomSound = false;
    let lastViolationAt = 0;
    customSound.addEventListener('canplaythrough', () => { hasCustomSound = true; }, { once: true });
    customSound.addEventListener('error', () => { hasCustomSound = false; });
    let audioCtx = null;
    let lastSoundAt = 0;

    function unlockAudio() {
      // เบราว์เซอร์ยอมให้เล่นเสียงได้หลังผู้ใช้กดปุ่มเท่านั้น เลยเตรียมไว้ตอนกด "เปิดกล้อง"
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      // Safari ต้องให้เพลงเริ่มเล่นจากการกดปุ่มสักครั้ง เลยเล่นแบบปิดเสียงแล้วหยุดทันที
      customSound.muted = true;
      customSound.play()
        .then(() => { customSound.pause(); customSound.currentTime = 0; })
        .catch(() => {})
        .finally(() => { customSound.muted = false; });
    }

    function playSiren() {
      // ไซเรนสั้น ๆ 1.2 วินาที เสียงสูง-ต่ำสลับกัน
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      for (let i = 0; i < 4; i++) {
        osc.frequency.setValueAtTime(i % 2 ? 660 : 990, now + i * 0.3);
      }
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.15, now + 0.02);
      gain.gain.setValueAtTime(0.15, now + 1.15);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 1.2);
    }

    function alarm() {
      const stage = document.getElementById('stage');
      stage.classList.remove('alarm');
      void stage.offsetWidth;          // รีเซ็ตแอนิเมชันให้กะพริบใหม่
      stage.classList.add('alarm');

      const now = Date.now();
      if (!document.getElementById('soundToggle').checked) return;
      if (now - lastSoundAt < SOUND_COOLDOWN_MS) return;
      lastSoundAt = now;

      if (!hasCustomSound && audioCtx) playSiren();
    }

    function updateSong(violation) {
      // เรียกทุกเฟรม: เจอคนฝ่าฝืน = เล่นเพลง, ไม่เจอเกิน 2 วินาที = หยุด
      if (!hasCustomSound) return;
      const now = Date.now();
      if (violation > 0) lastViolationAt = now;
      const shouldPlay = document.getElementById('soundToggle').checked
        && now - lastViolationAt < SONG_STOP_AFTER_MS;
      if (shouldPlay && customSound.paused) {
        customSound.play().catch(() => {});
      } else if (!shouldPlay && !customSound.paused) {
        customSound.pause();
      }
    }

    async function startCamera() {
      unlockAudio();
      stopCamera();
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
        video.srcObject = stream;
        await video.play();
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        statusEl.innerText = 'เปิดกล้องสำเร็จ กำลังติดตามวัตถุด้วย ByteTrack...';
        timer = setInterval(captureAndDetect, 250);
      } catch (err) {
        statusEl.innerText = 'ไม่สามารถเปิดกล้องได้: ' + err.message;
      }
    }

    function stopCamera() {
      if (timer) clearInterval(timer);
      customSound.pause();
      if (stream) stream.getTracks().forEach(t => t.stop());
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      statusEl.innerText = 'หยุดการทำงานของกล้องแล้ว';
    }

    async function captureAndDetect() {
      if (busy || !stream) return;
      busy = true;
      try {
        const offscreen = document.createElement('canvas');
        offscreen.width = canvas.width;
        offscreen.height = canvas.height;
        offscreen.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

        const blob = await new Promise(r => offscreen.toBlob(r, 'image/jpeg', 0.8));
        const form = new FormData();
        form.append('file', blob, 'frame.jpg');

        const res = await fetch('/predict', { method: 'POST', body: form });   // ใช้ค่าความมั่นใจขั้นต่ำ 45% จากเซิร์ฟเวอร์
        const data = await res.json();

        console.log(data)

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let safe = 0;
        let violation = 0;

        (data.predictions || []).forEach(p => {
          let [x1, y1, x2, y2] = p.bbox_xyxy;
          // ภาพกล้องโชว์แบบกระจก กรอบก็ต้องกลับซ้าย-ขวาตาม (ตัวหนังสือยังอ่านได้ปกติ)
          if (document.getElementById('mirrorToggle').checked) {
            [x1, x2] = [canvas.width - x2, canvas.width - x1];
          }
          let color = '#38bdf8'; // สีฟ้าสำหรับ person
          if (p.category === 'violation') {
            color = '#ef4444';   // สีแดงสำหรับ not_helmet และ non_industrial_headwear
            violation++;
          } else if (p.category === 'safe') {
            color = '#22c55e';   // สีเขียวสำหรับ helmet_*
            safe++;
          }

          ctx.strokeStyle = color;
          ctx.lineWidth = 3;
          ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

          const idTag = p.track_id !== null && p.track_id !== undefined ? `#${p.track_id} ` : '';
          const text = `${idTag}${p.class} ${(p.confidence * 100).toFixed(0)}%`;
          ctx.font = 'bold 13px sans-serif';
          ctx.fillStyle = color;
          ctx.fillRect(x1, Math.max(0, y1 - 24), ctx.measureText(text).width + 14, 24);
          ctx.fillStyle = '#020617';
          ctx.fillText(text, x1 + 6, Math.max(16, y1 - 6));
        });

        document.getElementById('safeCount').innerText = safe;
        document.getElementById('violationCount').innerText = violation;
        if (violation > 0) alarm();
        updateSong(violation);
        statusEl.innerText = `ตรวจพบทั้งหมด ${data.count} กรอบ (สวมหมวก: ${safe} | ฝ่าฝืน: ${violation})`;
      } catch (e) {
        statusEl.innerText = 'เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์: ' + e.message;
      } finally {
        busy = false;
      }
    }
  </script>
</body>
</html>
